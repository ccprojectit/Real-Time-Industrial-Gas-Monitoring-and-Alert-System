services:
  - type: web
    name: gas-monitoring-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: SIMULATOR_MAX_RUNTIME_SECONDS
        value: "900"
      - key: SIMULATOR_INTERVAL_SECONDS
        value: "0.35"
      - key: CRITICAL_SIMULATION_COOLDOWN_SECONDS
        value: "5"
      - key: SMS_MODE
        value: mock
      - key: SMS_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
